# red wenzi 博客 · Nginx 配置模板
# 放到 /etc/nginx/conf.d/redwenzi.conf
# 把 example.com 换成你的备案域名，/var/www/example 换成站点目录

# 80 端口只做跳转（备案期间云厂商通常要求 80 可访问，保留跳转即可）
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    root /var/www/example;
    index index.html;

    # 证书：用云厂商免费证书或 certbot 签发后填这里
    ssl_certificate     /etc/nginx/ssl/example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    charset utf-8;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # 静态资源长缓存；HTML 不缓存，方便你随时更新
    location ~* \.(css|js|png|jpe?g|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # 隐藏 .git / tools / deploy 等目录，别让它们可访问
    location ~ ^/(\.git|tools|deploy|docs)/ { deny all; }
}
